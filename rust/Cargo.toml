[package]
name = "cap-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native offline Windows screenshot, annotation and recorder"
license = "MIT"

[lib]
name = "cap_rust"
path = "src/lib.rs"

[[bin]]
name = "cap-rust"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
flate2 = "=1.1.10"
windows = { version = "=0.61.3", features = [
    "Foundation", "Foundation_Collections", "Globalization", "Graphics_Capture",
    "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation", "Win32_Media_MediaPlayer", "Win32_Storage_FileSystem", "Win32_Security",
    "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange",
    "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Ole",
    "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant",
    "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

